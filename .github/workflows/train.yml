name: Retrain and Monitor Pipeline

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "params.yaml"
      - ".github/workflows/pipeline.yml"

  workflow_dispatch:

  schedule:
    - cron: "0 */12 * * *"   # every 12 hours

permissions:
  contents: write

jobs:
  retrain-and-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DVC remote
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "${{ secrets.DAGSHUB_USERNAME }}"
          dvc remote modify origin --local password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Pull DVC data
        run: dvc pull --allow-missing || echo "DVC pull completed with warnings"

      - name: Check for new data
        run: |
          if [ -f "data/new_data.csv" ]; then
            echo "NEW_DATA=true" >> $GITHUB_ENV
            echo "New data detected."
          else
            echo "NEW_DATA=false" >> $GITHUB_ENV
            echo "No new data."
          fi

      - name: Merge new data into Power.csv
        if: env.NEW_DATA == 'true'
        run: |
          python -c "
          import pandas as pd, os, shutil
          from datetime import datetime

          main_path = 'data/Power.csv'
          new_path  = 'data/new_data.csv'
          archive   = 'data/processed'

          old_df = pd.read_csv(main_path)
          new_df = pd.read_csv(new_path)
          print(f'Main dataset rows : {len(old_df)}')
          print(f'New data rows     : {len(new_df)}')

          combined = pd.concat([old_df, new_df], ignore_index=True)
          combined = combined.drop_duplicates().dropna()
          print(f'Combined rows     : {len(combined)}')

          combined.to_csv(main_path, index=False)
          print('Saved updated Power.csv')

          os.makedirs(archive, exist_ok=True)
          ts = datetime.now().strftime('%Y%m%d_%H%M%S')
          shutil.move(new_path, f'{archive}/new_data_{ts}.csv')
          print('Archived new_data.csv')
          "

      - name: Run full pipeline
        run: |
          python src/preprocess.py
          python src/model.py
          python src/evaluate.py
          python src/monitor.py

      - name: Push updated artifacts to DVC
        if: env.NEW_DATA == 'true'
        run: dvc push || echo "DVC push completed with warnings"

      - name: Commit updated files
        run: |
          git add artifacts/ monitoring/ || true
          if [ "$NEW_DATA" = "true" ]; then
            git add data/processed/ dvc.lock || true
          fi
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Pipeline run: updated artifacts and monitoring [skip ci]"
            git push
          fi

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results-${{ github.run_id }}
          path: |
            artifacts/models/
            artifacts/metrics/
            artifacts/preprocessing/
            artifacts/model_comparison.png
            monitoring/reports/
            monitoring/alerts/
          retention-days: 7

      - name: Pipeline summary
        run: |
          echo "========================================"
          echo " PIPELINE COMPLETE"
          if [ "$NEW_DATA" = "true" ]; then
            echo " New data detected — merged and retrained."
          else
            echo " No new data — pipeline ran on existing data."
          fi
          echo "========================================"